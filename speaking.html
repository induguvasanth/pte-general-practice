<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTE Speaking Practice</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14213d;--muted:#60708a;--line:#e1e6ef;--p:#5637ee;--p2:#7b32e9;--soft:#efedff;--dark:#101827;--red:#ef9094}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}button{font:inherit;cursor:pointer}
.header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-weight:900}.dash{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800}
.page{max-width:1450px;margin:auto;padding:14px 22px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:12px}.tab{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:10px 5px;font-size:11px;font-weight:900}.tab.active{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.tab small{display:block;font-size:8px;opacity:.75;margin-top:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 335px;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px #1b2a450f}.practice,.side{padding:18px;min-width:0}.qhead{display:flex;justify-content:space-between;margin-bottom:8px}.kicker{font-size:10px;font-weight:900;color:var(--p);letter-spacing:.1em}.count{font-size:10px;color:var(--p);background:var(--soft);padding:6px 10px;border-radius:15px}.instruction{font-size:12px;color:#526681;line-height:1.5}.passage{background:#f8fafc;border:1px solid var(--line);border-radius:15px;padding:18px 20px;font-size:20px;line-height:1.58;font-weight:650;min-height:220px;display:flex;align-items:center}.audio{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:10px;margin:10px 0}.audio audio{width:100%;height:36px}.prep{text-align:center;padding:8px}.prepTime{font-size:40px;font-weight:900;color:var(--p)}.prepLabel{font-size:8px;font-weight:900;color:#697890;text-transform:uppercase}
.record{display:grid;grid-template-columns:125px 1fr;background:var(--dark);color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:10px}.timerLabel{font-size:9px;color:#aeb9ca}.timer{font-size:24px;font-weight:900}.rec{display:flex;justify-content:flex-end;align-items:center;gap:7px;color:#aeb9ca;font-size:10px;font-weight:800}.rec.live{color:#ff8d90}.rec i{width:8px;height:8px;border-radius:50%;background:#ff7075}.rec.live i{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.25}}
.controls{display:grid;grid-template-columns:1.3fr .7fr .8fr .8fr;gap:7px}.btn{border:0;border-radius:10px;min-height:39px;padding:8px;font-size:11px;font-weight:850}.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.stop{background:var(--red);color:#fff}.soft{background:#edf0f6;color:#34445b}
.trans{margin-top:10px}.transTitle{display:flex;justify-content:space-between;margin-bottom:6px}.transTitle b{font-size:9px;color:#68778e;letter-spacing:.08em}.badge{font-size:8px;color:#047857;background:#d9f8ec;padding:4px 7px;border-radius:12px;font-weight:900}.transcript{height:105px;overflow:auto;background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:11px;font-size:13px;line-height:1.55;color:#27374f}.empty{color:#9ba7b8}
.scoreTitle{font-size:18px;margin:0 0 10px}.scoreBox{background:linear-gradient(145deg,#f0efff,#f7f5ff);border-radius:15px;text-align:center;padding:15px}.score{font-size:36px;font-weight:900;color:var(--p)}.scoreBox small{font-size:9px;color:var(--muted)}.metric{margin:10px 0}.mrow{display:flex;justify-content:space-between;font-size:10px;font-weight:850}.track{height:7px;background:#e7e9ee;border-radius:10px;margin-top:5px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2))}.sideBtn{width:100%}.tips,.hint,.diag{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:11px}.tips h3,.hint h3,.diag h3{font-size:11px;margin:0 0 6px}.tips ul{margin:0;padding-left:17px;font-size:10px;color:#62728a;line-height:1.65}.hint p,.diag p{font-size:10px;color:#62728a;line-height:1.5;margin:0}.future{min-height:540px;display:grid;place-items:center;text-align:center;padding:30px}.future .icon{font-size:45px}.future h2{margin:8px}.future p{max-width:530px;color:var(--muted);font-size:12px;line-height:1.6}.tag{display:inline-block;background:var(--soft);color:#4931cf;padding:7px 12px;border-radius:20px;font-size:9px;font-weight:900}
@media(max-width:900px){.grid{grid-template-columns:1fr 290px}.tabs{overflow:auto;grid-template-columns:repeat(5,minmax(125px,1fr))}}@media(max-width:720px){.header{height:58px;padding:0 10px}.brand{font-size:15px}.logo{width:34px;height:34px}.page{padding:10px 8px}.grid{grid-template-columns:1fr;gap:9px}.practice,.side{padding:13px;border-radius:16px}.side{order:2}.passage{font-size:17px;min-height:205px;padding:15px}.controls{grid-template-columns:1fr 1fr}.controls .primary{grid-column:span 2}}
</style></head><body>
<header class="header"><div class="brand"><div class="logo">P</div>PTE Practice Studio</div><button class="dash" onclick="location.href='index.html'">← Dashboard</button></header>
<main class="page"><nav class="tabs">
<button class="tab active" data-task="read">📖 Read Aloud<small>Phase 2.1</small></button>
<button class="tab" data-task="repeat">🎧 Repeat Sentence<small>Phase 2.2</small></button>
<button class="tab" data-task="describe">🖼️ Describe Image<small>Phase 2.3</small></button>
<button class="tab" data-task="retell">🎤 Retell Talk<small>Phase 2.4</small></button>
<button class="tab" data-task="short">💬 Short Answer<small>Phase 2.5</small></button></nav>
<div id="loading" class="card" style="padding:35px;text-align:center;color:var(--muted)">Loading speaking practice...</div>
<div id="grid" class="grid" style="display:none"><section class="card practice"><div id="main"></div></section>
<aside class="card side"><h2 class="scoreTitle">Your Score</h2><div class="scoreBox"><div id="score" class="score">—</div><small>PTE-style practice score / 90</small></div>
<div class="metric"><div class="mrow"><span>Content</span><span id="contentV">—</span></div><div class="track"><div id="contentB" class="fill"></div></div></div>
<div class="metric"><div class="mrow"><span>Fluency</span><span id="fluencyV">—</span></div><div class="track"><div id="fluencyB" class="fill"></div></div></div>
<div class="metric"><div class="mrow"><span>Pronunciation Practice</span><span id="pronV">—</span></div><div class="track"><div id="pronB" class="fill"></div></div></div>
<button id="evaluate" class="btn primary sideBtn">📊 Evaluate My Answer</button>
<div class="tips"><h3>💡 Tips & Tricks</h3><ul id="tips"></ul></div><div class="hint"><h3>🎯 Quick Hint</h3><p id="hint"></p></div><div class="diag"><h3>🔎 Connection Diagnostics</h3><p id="diag">Checking...</p></div></aside></div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzvOE168xU6YwgBS2DaIvaymghRNCyW71DwKTjnZDtlMjHc8m8K4iDO0HvZYFkDbC1T/exec';let task='read',qs=[],i=0,rec=null,recording=false,finalText='',interim='',started=0,timer=null,prep=null;
const $=x=>document.getElementById(x);
function jsonp(a){return new Promise((ok,no)=>{let cb='pte_sp_'+Date.now(),s=document.createElement('script'),tm=setTimeout(()=>{s.remove();delete window[cb];no(Error('Backend timeout'))},15000);window[cb]=d=>{clearTimeout(tm);delete window[cb];s.remove();ok(d)};s.onerror=()=>{clearTimeout(tm);s.remove();delete window[cb];no(Error('Backend connection failed'))};s.src=API_URL+'?action='+a+'&callback='+cb+'&t='+Date.now();document.body.appendChild(s)})}
async function init(){try{let d=await jsonp('speaking');window.data=d.speaking||{};$('loading').style.display='none';$('grid').style.display='grid';setupSpeech();activate('read')}catch(e){$('loading').textContent=e.message}}
function activate(t){stop();task=t;i=0;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.task===t));render();setTips()}
function render(){if(task==='read'||task==='repeat'){qs=task==='read'?(data.readAloud?.questions||[]):(data.repeatSentence?.questions||[]);if(!qs.length){$('main').innerHTML='<div class="future"><div><div class="icon">'+(task==='read'?'📖':'🎧')+'</div><h2>No questions found</h2><p>Check the connected Google Sheet and the sheet name/headers.</p></div></div>';return}let q=qs[i];$('main').innerHTML=task==='read'?readHTML(q):repeatHTML(q);bind();if(task==='read')prepTimer()}else{future(task)}reset()}
function readHTML(q){return `<div class="qhead"><span class="kicker">QUESTION ${i+1}</span><span class="count">${i+1} / ${qs.length}</span></div><p class="instruction">📖 Read clearly and naturally. Use meaningful phrases, steady rhythm and accurate pronunciation.</p><div class="passage">${esc(q.text)}</div><div class="prep"><div id="prepTime" class="prepTime">00:35</div><div class="prepLabel">Preparation Time</div></div>${recordHTML()}`}
function repeatHTML(q){return `<div class="qhead"><span class="kicker">QUESTION ${i+1}</span><span class="count">${i+1} / ${qs.length}</span></div><p class="instruction">🎧 Listen carefully, remember the word order, then repeat the sentence naturally.</p><div class="audio">🔊 Question Audio<audio controls preload="metadata" src="${esc(q.audioUrl||'')}"></audio></div><div class="hint" style="margin:0 0 10px"><h3>🎯 Listen First</h3><p>Focus on meaning and word order. Do not look at the reference while answering.</p></div>${recordHTML()}<div class="reference" style="margin-top:10px"><button id="reveal" class="btn soft">Show Reference</button><p id="ref" style="display:none;font-size:13px;font-weight:700">${esc(q.text)}</p></div>`}
function recordHTML(){return `<div class="record"><div><div class="timerLabel">SPEAKING TIME</div><div id="timer" class="timer">00:00</div></div><div id="rec" class="rec"><i></i><span id="recText">Ready to record</span></div></div><div class="controls"><button id="start" class="btn primary">🎙️ Start Practice</button><button id="stop" class="btn stop" disabled>■ Stop</button><button id="prev" class="btn soft">← Previous</button><button id="next" class="btn soft">Next →</button></div><div class="trans"><div class="transTitle"><b>LIVE SPEECH TRANSCRIPT</b><span id="liveBadge" class="badge">READY</span></div><div id="transcript" class="transcript empty">Your recognized speech will appear here while you speak...</div></div>`}
function bind(){$('start').onclick=startRec;$('stop').onclick=stop;$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{if(i<qs.length-1){i++;render()}};if($('reveal'))$('reveal').onclick=()=>{$('ref').style.display=$('ref').style.display==='block'?'none':'block'}}
function setupSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('diag').textContent='Speech Recognition unavailable. Use current Chrome/Edge.';return}rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang='en-IN';rec.onstart=()=>{recording=true;started=Date.now();$('rec').classList.add('live');$('recText').textContent='LIVE — listening';$('liveBadge').textContent='LISTENING';$('start').disabled=true;$('stop').disabled=false;timer=setInterval(()=>{$('timer').textContent=fmt(Math.floor((Date.now()-started)/1000))},250)};rec.onresult=e=>{let f=finalText,x='';for(let n=e.resultIndex;n<e.results.length;n++){let t=e.results[n][0].transcript;e.results[n].isFinal?f+=' '+t:x+=' '+t}finalText=f.trim();interim=x.trim();renderTranscript()};rec.onerror=e=>{if(e.error==='not-allowed')toast('Allow microphone for this site.');else toast('Speech recognition: '+e.error)};rec.onend=()=>{if(recording){recording=false;$('rec').classList.remove('live');$('recText').textContent='Recording stopped';$('start').disabled=false;$('stop').disabled=true;clearInterval(timer)}}}
async function startRec(){if(!rec)return toast('Speech Recognition unavailable.');finalText='';interim='';renderTranscript();try{let s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(x=>x.stop());rec.start()}catch(e){toast('Microphone permission was not granted.')}}
function stop(){if(rec)try{rec.stop()}catch(e){}recording=false;clearInterval(timer);if($('start')){$('start').disabled=false;$('stop').disabled=true}}
function renderTranscript(){if(!$('transcript'))return;let t=(finalText+' '+interim).trim();$('transcript').textContent=t||'Your recognized speech will appear here while you speak...';$('transcript').classList.toggle('empty',!t)}
function evaluate(){if(!qs.length)return;let expected=tok(qs[i].text),spoken=tok((finalText+' '+interim).trim());if(!spoken.length)return toast('Record your answer first.');let set=new Set(spoken),m=expected.filter(w=>set.has(w)).length,c=Math.round(m/expected.length*100),sec=Math.max(1,(Date.now()-started)/1000),w=Math.round(spoken.length/sec*60),f=100;if(w<65)f-=20;else if(w<85)f-=8;else if(w>190)f-=15;else if(w>165)f-=7;f=Math.max(0,Math.min(100,f));let p=Math.round(c*.75+f*.25),s=Math.min(90,Math.round((c*.6+f*.2+p*.2)*.9));$('score').textContent=s+'/90';metric('content',c);metric('fluency',f);metric('pron',p);save(task==='read'?'Read Aloud':'Repeat Sentence',qs[i].id,qs[i].text,spoken.join(' '),s,c,f,p,w,sec)}
$('evaluate').onclick=evaluate;
function save(t,id,e,a,s,c,f,p,w,d){fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({task:t,questionId:id,expectedText:e,spokenText:a,pteScore:s,content:c,fluency:f,pronunciation:p,wpm:w,duration:Math.round(d)}),mode:'no-cors'}).catch(()=>{})}
function metric(n,v){$(n+'V').textContent=Math.round(v)+'%';$(n+'B').style.width=v+'%'}function reset(){$('score').textContent='—';['content','fluency','pron'].forEach(n=>{$(n+'V').textContent='—';$(n+'B').style.width='0%'})}
function prepTimer(){clearInterval(prep);let s=35;prep=setInterval(()=>{s--;if($('prepTime'))$('prepTime').textContent='00:'+String(Math.max(0,s)).padStart(2,'0');if(s<=0)clearInterval(prep)},1000)}
function setTips(){let d={read:[['Scan punctuation.','Read in phrases.','Keep steady pace.','Do not restart.','Finish clearly.'],'Use punctuation as natural phrase boundaries.'],repeat:[['Listen carefully.','Remember word order.','Start promptly.','Keep natural pace.','Do not restart.'],'Think in short word groups, not isolated words.'],describe:[['Start with the main subject.','Describe key features.','Use comparisons.','Avoid long pauses.','Conclude clearly.'],'Use Introduction → Key features → Details → Conclusion.'],retell:[['Catch the topic.','Remember key ideas.','Use linking words.','Keep speaking.','Finish with a summary.'],'Use First… Then… Finally… to keep structure.'],short:[['Listen fully.','Answer directly.','Be concise.','Pronounce clearly.','Avoid unrelated detail.'],'Give one short complete answer.']}[task];$('tips').innerHTML=d[0].map(x=>'<li>'+x+'</li>').join('');$('hint').textContent=d[1];$('diag').textContent='HTTPS: '+(location.protocol==='https:'?'YES':'NO')+' • Microphone: '+(navigator.mediaDevices?'YES':'NO')+' • Speech Recognition: '+((window.SpeechRecognition||window.webkitSpeechRecognition)?'YES':'NO')}
function future(t){let d={describe:['🖼️','PHASE 2.3','Describe Image','Describe the image using Introduction → Key features → Details → Conclusion.'],retell:['🎤','PHASE 2.4','Retell Talk','Listen for the topic and key ideas, then retell the talk using logical links.'],short:['💬','PHASE 2.5','Short Answer','Listen to the question and give a short, direct spoken answer.']}[t];$('main').innerHTML=`<div class="future"><div><div class="icon">${d[0]}</div><span class="tag">${d[1]}</span><h2>${d[2]}</h2><p>${d[3]} This one-page workspace is ready for the task-specific question sheet and scoring rules.</p></div></div>`}
function tok(s){return String(s||'').toLowerCase().replace(/[^a-z0-9'\\s]/g,' ').split(/\\s+/).filter(Boolean)}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(m){alert(m)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activate(b.dataset.task));init();
</script></body></html>
